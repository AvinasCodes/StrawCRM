services:
  # ─────────────────────────────────────────────────────────────
  # BACKEND SERVICE (FastAPI Python REST API)
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: strawcrm-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: Implementation/Backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: PROJECT_NAME
        value: StrawCRM API
      - key: FIREBASE_PROJECT_ID
        value: strawcrm-98ee3
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: avinash48as@gmail.com
      - key: BREVO_SENDER_NAME
        value: StrawCRM Notifications
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: StrawCRM <onboarding@resend.dev>
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: avinash48as@gmail.com
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_NAME
        value: StrawCRM Notifications

  # ─────────────────────────────────────────────────────────────
  # FRONTEND SERVICE (Vite React SPA - Static Site)
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: strawcrm-frontend
    runtime: static
    rootDir: Implementation/Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://strawcrm-backend.onrender.com
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: strawcrm-98ee3.firebaseapp.com
      - key: VITE_FIREBASE_PROJECT_ID
        value: strawcrm-98ee3
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: strawcrm-98ee3.firebasestorage.app
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        value: "232404623023"
      - key: VITE_FIREBASE_APP_ID
        value: 1:232404623023:web:344f2ac4c0731f4335be5a
      - key: VITE_FIREBASE_MEASUREMENT_ID
        value: G-LGSB4TPGVQ
      - key: VITE_GEMINI_API_KEY
        sync: false
