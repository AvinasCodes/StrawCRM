services:
  # ─────────────────────────────────────────────────────────────
  # BACKEND SERVICE (FastAPI Python REST API)
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: strawcrm-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: Implementation/Backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PROJECT_NAME
        value: StrawCRM API
      - key: FIREBASE_PROJECT_ID
        value: strawcrm-98ee3
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

  # ─────────────────────────────────────────────────────────────
  # FRONTEND SERVICE (Vite React SPA - Static Site)
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: strawcrm-frontend
    runtime: static
    rootDir: Implementation/Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: strawcrm-backend
          property: host
